
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: atikrh-beep
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23800080&color_dots=%23161B22,%230D4429,%23006D32,%2300A344,%2300D364
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23800080&color_dots=%23161B22,%230D4429,%23006D32,%2300A344,%2300D364
            dist/github-contribution-grid-snake.gif?color_snake=%23800080&color_dots=%23161B22,%230D4429,%23006D32,%2300A344,%2300D364&color_background=%23010409

      - name: Publish Snake Animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
