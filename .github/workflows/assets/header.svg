I rebuilt the header so it animates reliably on phones. It now uses CSS animations instead of SMIL, and the full design still shows even if a browser blocks the motion. Replace everything in `assets/header.svg` with this:

```xml
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Atikur Rahman - Full-Stack Web Developer">
<style>
.rv{opacity:1;animation:rv .4s ease-out var(--d) both}
@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out var(--d) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.nm{animation:nm .7s ease-out var(--d) both}
@keyframes nm{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.ed{animation:ed .5s ease-out var(--d) both}
@keyframes ed{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sel{opacity:0;animation:sel 1.6s ease-in-out var(--d) both}
@keyframes sel{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.rip{opacity:0;transform-box:fill-box;transform-origin:center;animation:rip .6s ease-out var(--d) both}
@keyframes rip{from{opacity:.9;transform:scale(.2)}to{opacity:0;transform:scale(1)}}
.fl{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:3 97;opacity:0;animation:fl 2.4s linear var(--d) infinite forwards}
@keyframes fl{from{stroke-dashoffset:0;opacity:1}to{stroke-dashoffset:-100;opacity:1}}
.pulse{opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out 7s infinite forwards}
@keyframes pulse{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.8)}}
.blink{animation:blink 1s steps(2,start) var(--d) infinite}
@keyframes blink{to{opacity:0}}
.live{animation:live 1.6s ease-in-out 7s infinite}
@keyframes live{50%{opacity:.2}}
.pf{transform-box:fill-box;transform-origin:left center;animation:pf 5.3s linear .3s both}
@keyframes pf{from{transform:scaleX(0)}to{transform:none}}
.ct{opacity:0}
.fin{opacity:1;animation:fin .3s ease-out 6.06s both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.gA{animation:gA 18s ease-in-out infinite}.gB{animation:gB 20s ease-in-out infinite}
@keyframes gA{50%{transform:translate(160px,90px)}}
@keyframes gB{50%{transform:translate(-150px,-90px)}}
.cur{opacity:0}
